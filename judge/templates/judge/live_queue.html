{% load static %}<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b2029" media="(prefers-color-scheme: dark)">
  <title>Hàng chờ Live</title>
  <link rel="stylesheet" href="{% static 'judge/app.css' %}">
  <link rel="stylesheet" href="{% static 'judge/live.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Hàng chờ Live</h1>
      </div>
      <nav class="nav">
        <a href="{% url 'live' %}">← Về phiên live</a>
      </nav>
      {% if user.is_authenticated %}
        <form class="top-live" method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <span class="muted small">👤 {{ me }}</span>
          <button type="submit" class="btn">Đăng xuất</button>
        </form>
      {% else %}
        <div class="top-live">
          <span class="pill pill-muted">Chế độ demo · 👤 {{ me }}</span>
          <a class="btn" href="{% url 'login' %}?next={% url 'live_queue' %}">Đăng nhập</a>
        </div>
      {% endif %}
    </div>
  </header>

  <main class="queue-layout">
    {% csrf_token %}
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab" data-view="open" aria-selected="true">Đang chờ <span class="count" id="count-open">0</span></button>
      <button type="button" role="tab" class="tab" data-view="done" aria-selected="false">Đã xử lý</button>
      <button type="button" role="tab" class="tab" data-view="hidden" aria-selected="false">Đã ẩn <span class="count" id="count-hidden">0</span></button>
    </div>

    <div class="chips" id="kind-filter">
      <button type="button" class="chip" data-kind="" aria-pressed="true">Tất cả</button>
      {% for key, k in kinds.items %}
        <button type="button" class="chip" data-kind="{{ key }}" aria-pressed="false">{{ k.emoji }} {{ k.label }}</button>
      {% endfor %}
    </div>

    <p id="queue-error" class="error" role="alert"></p>
    <ol id="queue-list" class="queue-list"></ol>
    <p id="queue-empty" class="queue-empty muted" hidden></p>
  </main>

  <script src="{% static 'judge/live_queue.js' %}"></script>
</body>
</html>
